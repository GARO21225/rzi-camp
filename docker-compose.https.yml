version: '3.9'

# Fichier additif : ne remplace pas docker-compose.yml, s'utilise avec -f en plus.
#
# Usage sur le serveur Hetzner :
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Le port 80 est déjà utilisé par un autre stack sur ce serveur (vérifié avec
# `sudo ss -tlnp`). On ne le touche pas : Caddy obtient le certificat Let's
# Encrypt via le challenge TLS-ALPN-01, qui ne passe que par le port 443
# (voir Caddyfile : "disable_ap" désactive volontairement le challenge HTTP-01).
# Seul le port 443 doit être ouvert sur le pare-feu :
#   ufw allow 443/tcp

services:
  frontend:
    build:
      args:
        # Une fois HTTPS actif, tout passe par le même domaine :
        # Caddy route /api/* vers le backend automatiquement.
        VITE_API_URL: https://204-168-229-74.sslip.io
    # Note : la fusion de "ports:" entre plusieurs fichiers docker-compose
    # additionne les listes, elle ne les remplace pas. Pour ne plus exposer
    # 5173/8001 directement (facultatif, pas bloquant), commente les lignes
    # "ports:" correspondantes directement dans docker-compose.yml.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"   # port 80 volontairement absent : déjà pris par un autre stack
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:

