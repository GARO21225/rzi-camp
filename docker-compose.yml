version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rzi_camp
      POSTGRES_USER: rzi
      POSTGRES_PASSWORD: rzi_secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 rzi_camp.asgi:application"
    environment:
      DATABASE_URL: postgresql://rzi:rzi_secret@db:5432/rzi_camp
      SECRET_KEY: rzi-camp-docker-secret-2026
      DEBUG: "False"
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://204.168.229.74:8001
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
