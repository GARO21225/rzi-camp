version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rzi_camp
      POSTGRES_USER: rzi
      POSTGRES_PASSWORD: rzi_secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 rzi_camp.asgi:application"
    environment:
      DATABASE_URL: postgresql://rzi:rzi_secret@db:5432/rzi_camp
      # SECURITE : plus de valeur en dur ici (ce fichier est sur GitHub public).
      # La vraie valeur vient de .env (jamais commité, voir .env.example).
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://204.168.229.74:5173
    ports:
      - "5173:443"
    depends_on:
      - backend

volumes:
  pgdata:
