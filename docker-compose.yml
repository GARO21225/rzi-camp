services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rzi_camp
      POSTGRES_USER: rzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD doit être définie dans .env — voir .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sous charge (plusieurs workers backend), la config Postgres par
    # défaut (max_connections=100) devient vite limitante. Marge de
    # sécurité pour ~2 workers backend + usage normal (serveur a 3.7 Go RAM
    # total, shared_buffers reduit en consequence pour laisser de la place
    # aux workers Python/Django, plus gourmands en memoire que Postgres ici).
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=4MB -c random_page_cost=1.1
    mem_limit: 800m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Indispensable dès plusieurs workers backend : sans lui, les
    # notifications temps réel (WebSocket) ne circuleraient pas d'un
    # processus worker à l'autre (voir CHANNEL_LAYERS dans settings.py).
    restart: unless-stopped
    mem_limit: 200m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && gunicorn rzi_camp.asgi:application -k uvicorn.workers.UvicornWorker -w ${WEB_CONCURRENCY:-4} -b 0.0.0.0:8000 --timeout 60 --keep-alive 30 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100"
    # env_file (pas environment: SECRET_KEY: ${SECRET_KEY}) : lit .env
    # DIRECTEMENT sans passer par la substitution de variables shell de
    # Docker Compose, qui donne toujours la priorité a une variable shell
    # (meme vide) sur le contenu de .env. Ce piège a cause des deconnexions
    # aleatoires a repetition (cle secrete vide -> regeneree au hasard a
    # chaque process) malgre un .env pourtant correct.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rzi:${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD doit être définie dans .env}@db:5432/rzi_camp
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    volumes:
      # Fichiers uploades (videos d'induction, etc.) - sans ce volume,
      # tout fichier uploade serait perdu au prochain rebuild du conteneur
      # (le systeme de fichiers du conteneur backend n'est pas persistant
      # par defaut).
      - media_data:/app/media
    # PAS de "ports:" ici volontairement : le frontend proxie deja /api/ et
    # /ws/ vers ce conteneur EN INTERNE via le reseau Docker (voir
    # nginx.conf, proxy_pass http://backend:8000). Publier "8001:8000" sur
    # l'IP publique exposait le backend en HTTP NON CHIFFRE, contournant
    # entierement le SSL/WebSocket/compression de nginx - une vraie porte
    # d'entree non securisee, sans aucune utilite pour le fonctionnement
    # reel de l'application.
    depends_on:
      - db
      - redis
    mem_limit: 1800m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # PAS de VITE_API_URL codé en dur ici volontairement (ça a cassé
      # l'accès par nom de domaine : l'app appelait toujours l'IP en dur,
      # peu importe l'adresse utilisée pour charger la page). Le Dockerfile
      # laisse ce build arg vide par défaut -> src/api/index.js détecte
      # l'API tout seul via window.location.origin, donc ça marche pour
      # l'IP (https://204.168.229.74:5173) ET pour un domaine
      # (https://app.roxgold-sitelife.com:5173) avec la MÊME image, sans
      # rebuild. Ne réintroduire cette ligne que si l'API est un jour
      # servie depuis un hôte réellement différent du frontend.
    ports:
      - "5173:443"
    volumes:
      # Certificat SSL généré une seule fois, persiste entre les rebuilds
      # (voir docker-entrypoint-ssl.sh) — évite d'invalider l'exception de
      # sécurité du navigateur à chaque redéploiement.
      - ssl_data:/etc/nginx/ssl
      # Certificat Let's Encrypt REEL (optionnel) — décommenter cette ligne
      # une fois le certificat obtenu sur l'hôte (voir instructions fournies :
      # certbot + plugin DNS Porkbun, défi DNS-01, aucun port entrant requis).
      # On monte TOUT /etc/letsencrypt (et pas seulement live/<domaine>) car
      # les fichiers sous live/ sont des liens symboliques RELATIFS vers
      # ../../archive/<domaine>/ — monter uniquement le sous-dossier live/
      # casse ces liens (cible hors du volume monté, illisible depuis le
      # conteneur même si `ls` les affiche comme présents).
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    mem_limit: 100m
    restart: unless-stopped

volumes:
  pgdata:
  ssl_data:
  media_data:
