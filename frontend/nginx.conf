server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Limite d'upload relevee pour les videos d'induction (defaut nginx: 1M,
    # bien trop bas - le backend Django limite deja a 50 Mo par fichier).
    client_max_body_size 55M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Fichiers Vite hashés (nom change à chaque build) : cache long terme sûr.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html DOIT toujours être revalidé — sinon, après un redéploiement,
    # une vieille version en cache navigateur pointe vers des fichiers JS/CSS
    # hashés qui n'existent plus (supprimés par le build suivant) -> 404
    # silencieux -> page blanche. Se voit typiquement à la premiere ouverture
    # après un déploiement, disparaît ensuite une fois le cache renouvelé.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /api/ { proxy_pass http://backend:8000; }

    # Fichiers uploades (videos d'induction, etc.) servis par Django
    location /media/ {
        proxy_pass http://backend:8000;
        client_max_body_size 55M;
    }

    # WebSocket (notifications temps réel) — jamais routé jusqu'ici, tombait
    # sur la page React au lieu du backend (échec silencieux de la connexion).
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    root /usr/share/nginx/html;
    index index.html;

    # Limite d'upload relevee pour les videos d'induction (defaut nginx: 1M,
